<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Tree — Poincaré Disk</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #f5f4ef; padding: 16px; }
#poincare-wrap { position:relative; width:100%; max-width:700px; margin:0 auto; }
#poincare-canvas { display:block; width:100%; border-radius:12px; cursor:grab; touch-action:none; background:#f5f4ef; }
#poincare-tip { position:absolute; pointer-events:none; opacity:0; background:#fff; border:0.5px solid #ccc; border-radius:8px; padding:6px 10px; font-size:12px; color:#222; transition:opacity .12s; white-space:nowrap; z-index:9; }
.legend-dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle; }
#legend { display:flex; flex-wrap:wrap; gap:8px 14px; padding:8px 0 4px; font-size:11px; color:#666; max-width:700px; margin:0 auto; }
</style>
</head>
<body>

<div id="poincare-wrap">
  <canvas id="poincare-canvas"></canvas>
  <div id="poincare-tip"></div>
</div>
<div id="legend"></div>

<script>
(function(){

const COLORS = {
  folder:     {fill:'#534AB7', stroke:'#AFA9EC'},
  code:       {fill:'#3B6D11', stroke:'#97C459'},
  image:      {fill:'#993556', stroke:'#ED93B1'},
  pdf:        {fill:'#993C1D', stroke:'#F0997B'},
  spreadsheet:{fill:'#0F6E56', stroke:'#5DCAA5'},
  config:     {fill:'#5F5E5A', stroke:'#B4B2A9'},
  text:       {fill:'#444441', stroke:'#B4B2A9'},
  audio:      {fill:'#854F0B', stroke:'#EF9F27'},
  video:      {fill:'#854F0B', stroke:'#F9CB42'},
  binary:     {fill:'#2C2C2A', stroke:'#888780'},
  archive:    {fill:'#A32D2D', stroke:'#F09595'},
  data:       {fill:'#185FA5', stroke:'#85B7EB'},
  markdown:   {fill:'#185FA5', stroke:'#B5D4F4'},
};
function col(t){ return COLORS[t]||{fill:'#888780',stroke:'#ccc'}; }

const legendEl = document.getElementById('legend');
[['folder','Folder'],['code','Code'],['image','Image'],['pdf','PDF'],['config','Config'],['data','Data/Markdown'],['audio','Audio/Video'],['archive','Archive']].forEach(([t,l])=>{
  const c=col(t);
  legendEl.innerHTML+=`<span><span class="legend-dot" style="background:${c.fill};border:1px solid ${c.stroke}"></span>${l}</span>`;
});

const TREE = {id:'root',name:'/',type:'folder',ch:[
  {id:'home',name:'home',type:'folder',ch:[
    {id:'alice',name:'alice',type:'folder',ch:[
      {id:'adocs',name:'Documents',type:'folder',ch:[
        {id:'resume',name:'resume.pdf',type:'pdf'},
        {id:'taxes',name:'taxes_2024.xlsx',type:'spreadsheet'},
        {id:'notes',name:'meeting_notes.md',type:'markdown'},
        {id:'thesis',name:'thesis_draft.docx',type:'pdf'},
      ]},
      {id:'apics',name:'Pictures',type:'folder',ch:[
        {id:'vacation',name:'vacation_2024',type:'folder',ch:[
          {id:'img1',name:'beach.jpg',type:'image'},
          {id:'img2',name:'sunset.jpg',type:'image'},
          {id:'img3',name:'mountains.jpg',type:'image'},
        ]},
        {id:'profile',name:'profile.png',type:'image'},
      ]},
      {id:'acode',name:'Projects',type:'folder',ch:[
        {id:'portfolio',name:'portfolio',type:'folder',ch:[
          {id:'indexhtml',name:'index.html',type:'code'},
          {id:'stylecss',name:'style.css',type:'code'},
          {id:'mainjs',name:'main.js',type:'code'},
        ]},
        {id:'mlmodel',name:'ml-model',type:'folder',ch:[
          {id:'trainpy',name:'train.py',type:'code'},
          {id:'dataset',name:'dataset.csv',type:'data'},
          {id:'modelpkl',name:'model.pkl',type:'binary'},
        ]},
      ]},
      {id:'amusic',name:'Music',type:'folder',ch:[
        {id:'mp1',name:'chill.mp3',type:'audio'},
        {id:'mp2',name:'focus.mp3',type:'audio'},
      ]},
    ]},
    {id:'bob',name:'bob',type:'folder',ch:[
      {id:'bdocs',name:'Documents',type:'folder',ch:[
        {id:'breport',name:'Q3_report.pdf',type:'pdf'},
        {id:'bbudget',name:'budget.xlsx',type:'spreadsheet'},
      ]},
      {id:'bdl',name:'Downloads',type:'folder',ch:[
        {id:'setup',name:'setup.exe',type:'binary'},
        {id:'arch',name:'archive.zip',type:'archive'},
        {id:'movie',name:'movie.mp4',type:'video'},
      ]},
    ]},
  ]},
  {id:'etc',name:'etc',type:'folder',ch:[
    {id:'nginx',name:'nginx',type:'folder',ch:[
      {id:'nginxconf',name:'nginx.conf',type:'config'},
      {id:'sites',name:'sites-enabled',type:'folder',ch:[
        {id:'defconf',name:'default',type:'config'},
        {id:'appconf',name:'app.conf',type:'config'},
      ]},
    ]},
    {id:'ssh',name:'ssh',type:'folder',ch:[
      {id:'sshd',name:'sshd_config',type:'config'},
      {id:'known',name:'known_hosts',type:'text'},
    ]},
    {id:'hosts',name:'hosts',type:'config'},
    {id:'fstab',name:'fstab',type:'config'},
  ]},
  {id:'var',name:'var',type:'folder',ch:[
    {id:'log',name:'log',type:'folder',ch:[
      {id:'syslog',name:'syslog',type:'text'},
      {id:'authlog',name:'auth.log',type:'text'},
      {id:'applog',name:'app.log',type:'text'},
      {id:'nginxlog',name:'nginx',type:'folder',ch:[
        {id:'access',name:'access.log',type:'text'},
        {id:'errlog',name:'error.log',type:'text'},
      ]},
    ]},
    {id:'www',name:'www',type:'folder',ch:[
      {id:'html',name:'html',type:'folder',ch:[
        {id:'wihtml',name:'index.html',type:'code'},
        {id:'about',name:'about.html',type:'code'},
        {id:'assets',name:'assets',type:'folder',ch:[
          {id:'logo',name:'logo.svg',type:'image'},
          {id:'appjs',name:'app.js',type:'code'},
        ]},
      ]},
    ]},
  ]},
  {id:'usr',name:'usr',type:'folder',ch:[
    {id:'bin',name:'bin',type:'folder',ch:[
      {id:'python3',name:'python3',type:'binary'},
      {id:'node',name:'node',type:'binary'},
      {id:'git',name:'git',type:'binary'},
    ]},
    {id:'local',name:'local',type:'folder',ch:[
      {id:'lbin',name:'bin',type:'folder',ch:[{id:'myapp',name:'myapp',type:'binary'}]},
      {id:'llib',name:'lib',type:'folder',ch:[{id:'libfoo',name:'libfoo.so',type:'binary'}]},
    ]},
  ]},
  {id:'tmp',name:'tmp',type:'folder',ch:[
    {id:'t1',name:'session.tmp',type:'text'},
    {id:'t2',name:'cache.tmp',type:'text'},
    {id:'t3',name:'upload_123',type:'binary'},
  ]},
]};

const nodes = [];
const edges = [];
const byId  = {};

function flatten(node, parent, depth, idx, total, parentAngle){
  const n = { id:node.id, name:node.name, type:node.type, depth, children:(node.ch||[]).map(c=>c.id), hx:0, hy:0 };
  nodes.push(n);
  byId[n.id] = n;
  if(parent) edges.push([parent, n.id]);
  const kids = node.ch||[];
  kids.forEach((c,i)=>flatten(c, n.id, depth+1, i, kids.length, parentAngle));
}
flatten(TREE, null, 0, 0, 1, 0);

function layout(id, startAngle, span){
  const n = byId[id];
  if(!n) return;
  const kids = n.children;
  if(!kids.length) return;
  const angleStep = span / kids.length;
  kids.forEach((cid, i)=>{
    const c = byId[cid];
    const angle = startAngle + (i + 0.5)*angleStep;
    const r = 1 - Math.pow(0.58, c.depth);
    c.hx = Math.min(r, 0.92) * Math.cos(angle);
    c.hy = Math.min(r, 0.92) * Math.sin(angle);
    layout(cid, angle - span/kids.length*0.48, span/kids.length*0.96);
  });
}
byId['root'].hx = 0; byId['root'].hy = 0;
layout('root', 0, 2*Math.PI);

const canvas = document.getElementById('poincare-canvas');
const ctx    = canvas.getContext('2d');
const tip    = document.getElementById('poincare-tip');

let W=600, H=600, R=260, ox=300, oy=300;
let cx=0, cy=0;
let zoom=1;
let hovered=null, selected=null;
let dragOn=false, lmx=0, lmy=0;

function setSize(){
  const wrap = document.getElementById('poincare-wrap');
  W = wrap.offsetWidth || 600;
  H = W;
  canvas.width  = W;
  canvas.height = H;
  canvas.style.height = H+'px';
  R = W * 0.44 * zoom;
  ox = W/2; oy = H/2;
}

function mob(zx, zy, ax, ay){
  const nx = zx - ax, ny = zy - ay;
  const dx = 1 - ax*zx - ay*zy;
  const dy =     ay*zx - ax*zy;
  const d2 = dx*dx + dy*dy;
  if(d2 < 1e-10) return [0,0];
  return [(nx*dx + ny*dy)/d2, (ny*dx - nx*dy)/d2];
}

function proj(hx, hy){
  const [x,y] = mob(hx, hy, cx, cy);
  return [ox + x*R, oy + y*R];
}

function nodeR(n){
  if(n.depth===0) return 13;
  if(n.depth===1) return 9;
  if(n.depth===2) return 7;
  return 5;
}

function draw(){
  ctx.clearRect(0,0,W,H);

  ctx.beginPath(); ctx.arc(ox,oy,R+1,0,2*Math.PI);
  ctx.fillStyle = '#f3f6fa';
  ctx.strokeStyle = '#cfd8e3';
  ctx.fill();
  ctx.lineWidth = 1; ctx.stroke();

  ctx.save();
  ctx.beginPath(); ctx.arc(ox,oy,R,0,2*Math.PI); ctx.clip();

  [0.33,0.6,0.8,0.93].forEach(rr=>{
    ctx.beginPath(); ctx.arc(ox,oy,R*rr,0,2*Math.PI);
    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 0.5; ctx.stroke();
  });

  edges.forEach(([aid,bid])=>{
    const a=byId[aid], b=byId[bid];
    if(!a||!b) return;
    const [px,py]=proj(a.hx,a.hy);
    const [qx,qy]=proj(b.hx,b.hy);
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(qx,qy);
    ctx.strokeStyle = 'rgba(60,58,52,0.18)';
    ctx.lineWidth = 0.8; ctx.stroke();
  });

  [...nodes].sort((a,b)=>a.depth-b.depth).forEach(n=>{
    const [px,py] = proj(n.hx,n.hy);
    if(Math.hypot(px-ox,py-oy) > R+10) return;
    const nr  = nodeR(n);
    const c   = col(n.type);
    const sel = selected===n.id;
    const hov = hovered===n.id;
    const boost = sel?3:hov?2:0;

    if(sel){
      ctx.beginPath(); ctx.arc(px,py,nr+7,0,2*Math.PI);
      ctx.fillStyle = c.fill+'44';
      ctx.fill();
    }
    ctx.beginPath(); ctx.arc(px,py,nr+boost,0,2*Math.PI);
    ctx.fillStyle = c.fill;
    ctx.fill();
    ctx.strokeStyle = c.stroke;
    ctx.lineWidth = sel?1.8:0.8;
    ctx.stroke();

    const showLabel = n.depth<=2 || hov || sel;
    if(showLabel){
      const lbl = n.name.length>14 ? n.name.slice(0,13)+'…' : n.name;
      const fs  = Math.max(8, Math.min(11, nr*1.1));
      ctx.font  = `${n.depth<=1?500:400} ${fs}px sans-serif`;
      ctx.textAlign = 'center';
      const tw  = ctx.measureText(lbl).width;
      const lx  = px, ly = py + nr + 3;
      ctx.fillStyle = 'rgba(255,255,255,0.82)';
      ctx.beginPath();
      ctx.roundRect(lx-tw/2-3, ly, tw+6, fs+3, 3);
      ctx.fill();
      ctx.fillStyle = '#2c2c2a';
      ctx.fillText(lbl, lx, ly+fs+1);
    }
  });

  ctx.restore();
}

function hit(mx,my){
  let best=null, bd=Infinity;
  nodes.forEach(n=>{
    const [px,py]=proj(n.hx,n.hy);
    const d=Math.hypot(px-mx,py-my);
    if(d<nodeR(n)+6 && d<bd){ bd=d; best=n; }
  });
  return best;
}

function animTo(tx,ty){
  const sx=cx, sy=cy;
  let step=0; const steps=22;
  const iv=setInterval(()=>{
    step++;
    const t=step/steps;
    const e=t<0.5?2*t*t:-2*t*t+4*t-1;
    cx=sx+(tx-sx)*e; cy=sy+(ty-sy)*e;
    const l=Math.hypot(cx,cy);
    if(l>0.93){cx*=0.93/l;cy*=0.93/l;}
    R=W*0.44*zoom; draw();
    if(step>=steps) clearInterval(iv);
  },16);
}

canvas.addEventListener('mousedown',e=>{
  dragOn=true; canvas.style.cursor='grabbing';
  const r=canvas.getBoundingClientRect();
  lmx=e.clientX-r.left; lmy=e.clientY-r.top;
});
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  if(dragOn){
    const dx=(mx-lmx)/R*0.72, dy=(my-lmy)/R*0.72;
    const [nx,ny]=mob(-dx,-dy,cx,cy);
    const l=Math.hypot(nx,ny);
    cx=nx/Math.max(1,l/0.93); cy=ny/Math.max(1,l/0.93);
    lmx=mx; lmy=my;
    draw();
  } else {
    const n=hit(mx,my);
    const prev=hovered;
    hovered=n?n.id:null;
    if(hovered!==prev) draw();
    if(n){
      canvas.style.cursor='pointer';
      tip.innerHTML=`<b>${n.name}</b><br><span style="color:#888;font-size:11px">${n.type}${n.children.length?' · '+n.children.length+' items':''}</span>`;
      tip.style.left=(mx+14)+'px'; tip.style.top=(my-8)+'px'; tip.style.opacity='1';
    } else {
      canvas.style.cursor='grab'; tip.style.opacity='0';
    }
  }
});
canvas.addEventListener('mouseup',e=>{
  dragOn=false; canvas.style.cursor='grab';
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  const n=hit(mx,my);
  if(n){ selected=(selected===n.id?null:n.id); animTo(n.hx,n.hy); }
  else draw();
});
canvas.addEventListener('mouseleave',()=>{ dragOn=false; tip.style.opacity='0'; hovered=null; draw(); });
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  zoom *= e.deltaY>0 ? 0.92 : 1.08;
  zoom = Math.max(0.3, Math.min(3.5, zoom));
  R=W*0.44*zoom; draw();
},{passive:false});

canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const r=canvas.getBoundingClientRect();lmx=t.clientX-r.left;lmy=t.clientY-r.top;dragOn=true;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];const r=canvas.getBoundingClientRect();const mx=t.clientX-r.left,my=t.clientY-r.top;if(dragOn){const dx=(mx-lmx)/R*0.72,dy=(my-lmy)/R*0.72;const[nx,ny]=mob(-dx,-dy,cx,cy);const l=Math.hypot(nx,ny);cx=nx/Math.max(1,l/0.93);cy=ny/Math.max(1,l/0.93);lmx=mx;lmy=my;draw();}},{passive:false});
canvas.addEventListener('touchend',()=>{dragOn=false;});

window.addEventListener('resize',()=>{ setSize(); R=W*0.44*zoom; draw(); });

setSize();
draw();
})();
</script>
</body>
</html>
